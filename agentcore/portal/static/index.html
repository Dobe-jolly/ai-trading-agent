<title>Helpdesk Agents Console</title>
<!--PORTAL-SERVED-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..100,500..800&family=Public+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: operations console. Section rail on the left (top tabs on phones), a health strip pinned
   over the work area, and every page ordered summary first, detail after. */
:root {
  --bg: #f3f5f3;
  --surface: #ffffff;
  --surface-2: #eaeeea;
  --line: #d6dcd7;
  --ink: #17201b;
  --ink-2: #4a5650;
  --ink-3: #75817a;
  --accent: #2a4cc2;
  --accent-soft: #e3e9fb;
  --ok: #1d7a4f;   --ok-soft: #dff1e7;
  --warn: #9a6205; --warn-soft: #f8ebcf;
  --crit: #b3372a; --crit-soft: #f8e1dd;
  --ask: #6447bd;  --ask-soft: #ebe4fa;
  --idle: #7d8780; --idle-soft: #e7eae7;
  --font-display: "Archivo", "Arial Narrow", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Public Sans", "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --font-mono: "JetBrains Mono", "Cascadia Mono", Consolas, "Liberation Mono", monospace;
  --radius: 6px;
  --shadow: 0 1px 2px rgb(16 24 20 / .06), 0 4px 14px rgb(16 24 20 / .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1312; --surface: #161b19; --surface-2: #1d2421; --line: #2a3330;
    --ink: #e4ebe7; --ink-2: #a6b2ab; --ink-3: #7a867f;
    --accent: #8ea5ff; --accent-soft: #1f2a4d;
    --ok: #57c993; --ok-soft: #173326; --warn: #e5aa45; --warn-soft: #382a10;
    --crit: #f1806e; --crit-soft: #3d1d18; --ask: #b8a3ff; --ask-soft: #2a2245;
    --idle: #8d978f; --idle-soft: #232a27;
    --shadow: 0 1px 2px rgb(0 0 0 / .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1312; --surface: #161b19; --surface-2: #1d2421; --line: #2a3330;
  --ink: #e4ebe7; --ink-2: #a6b2ab; --ink-3: #7a867f;
  --accent: #8ea5ff; --accent-soft: #1f2a4d;
  --ok: #57c993; --ok-soft: #173326; --warn: #e5aa45; --warn-soft: #382a10;
  --crit: #f1806e; --crit-soft: #3d1d18; --ask: #b8a3ff; --ask-soft: #2a2245;
  --idle: #8d978f; --idle-soft: #232a27;
  --shadow: 0 1px 2px rgb(0 0 0 / .3);
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font: 400 14px/1.5 var(--font-body);
  -webkit-font-smoothing: antialiased;
}
a { color: var(--accent); text-underline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h1, h2, h3 { font-family: var(--font-display); font-stretch: 85%; letter-spacing: -.005em; text-wrap: balance; margin: 0; }
h1 { font-size: 1.55rem; font-weight: 700; }
h2 { font-size: 1.05rem; font-weight: 650; }
h3 { font-size: .92rem; font-weight: 650; }
.mono { font-family: var(--font-mono); font-size: .86em; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--ink-2); }
.faint { color: var(--ink-3); }
.label { font-size: .7rem; text-transform: uppercase; letter-spacing: .08em; font-weight: 600; color: var(--ink-3); }

/* shell */
.app { display: grid; grid-template-columns: 216px minmax(0, 1fr); min-height: 100%; }
.rail { background: var(--surface); border-right: 1px solid var(--line); padding: 18px 12px; display: flex; flex-direction: column; gap: 18px; position: sticky; top: 0; height: 100vh; }
.brand { display: flex; gap: 10px; align-items: center; padding: 0 6px; }
.brand svg { flex: none; }
.brand b { font-family: var(--font-display); font-stretch: 80%; font-size: 1.02rem; font-weight: 750; line-height: 1.1; display: block; }
.brand span { font-size: .72rem; color: var(--ink-3); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 8px 10px; border-radius: var(--radius); color: var(--ink-2); text-decoration: none; font-weight: 500; }
.nav a:hover { background: var(--surface-2); color: var(--ink); }
.nav a[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 600; }
.nav .count { font-size: .72rem; font-variant-numeric: tabular-nums; background: var(--surface-2); color: var(--ink-2); border-radius: 999px; padding: 0 7px; }
.desks { display: grid; gap: 4px; padding: 0 2px; }
.desks a { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 7px 10px; border: 1px solid var(--line); border-radius: var(--radius); color: var(--ink-2); text-decoration: none; font-weight: 600; font-size: .86rem; background: var(--surface); }
.desks a:hover { border-color: var(--ink-3); color: var(--ink); }
.desks a[aria-current="true"] { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.desks a .badges { margin-left: auto; display: flex; gap: 4px; }
.desks a .badge { font-size: .68rem; font-weight: 700; border-radius: 999px; padding: 0 6px; line-height: 1.5; }
.desks a .badge.ask { background: var(--ask-soft); color: var(--ask); }
.desks a .badge.warn { background: var(--warn-soft); color: var(--warn); }
.desks a .badge.crit { background: var(--crit-soft); color: var(--crit); }
.rail-foot { margin-top: auto; font-size: .75rem; color: var(--ink-3); padding: 0 6px; display: grid; gap: 4px; }
.main { min-width: 0; padding-inline: 28px; padding-block: 0 48px; }

/* health strip */
.strip { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(6px); display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding-block: 12px; border-bottom: 1px solid var(--line); margin-bottom: 22px; }
.strip .spacer { flex: 1; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 3px 10px; font-size: .78rem; font-weight: 600; border: 1px solid transparent; white-space: nowrap; }
.pill .dot { width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.crit { background: var(--crit-soft); color: var(--crit); }
.pill.ask { background: var(--ask-soft); color: var(--ask); }
.pill.idle { background: var(--idle-soft); color: var(--ink-2); }
.pill.outline { border-color: var(--line); color: var(--ink-2); background: var(--surface); font-weight: 500; }
.demo-banner { background: var(--warn-soft); color: var(--warn); border: 1px solid color-mix(in srgb, var(--warn) 35%, transparent); padding: 8px 12px; border-radius: var(--radius); font-size: .82rem; margin-bottom: 18px; }

/* page head */
.head { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px; margin-bottom: 18px; }
.head p { margin: 4px 0 0; color: var(--ink-2); max-width: 70ch; }
.stack { display: grid; gap: 18px; align-content: start; }
.grid-2 { display: grid; gap: 18px; grid-template-columns: minmax(0, 1.6fr) minmax(0, 1fr); }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; min-width: 0; }
.panel > header { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
.panel > header p { margin: 2px 0 0; font-size: .8rem; color: var(--ink-3); }

/* KPIs */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.kpi { background: var(--surface); padding: 12px 14px 14px; display: grid; gap: 2px; align-content: start; box-shadow: 1px 0 0 var(--line), 0 1px 0 var(--line); }
.kpi b { font-family: var(--font-display); font-stretch: 80%; font-size: 1.85rem; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.kpi small { color: var(--ink-3); font-size: .75rem; }
.kpi.flag b { color: var(--warn); }

/* charts */
.chart svg { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--line); stroke-width: 1; }
.chart .axis { fill: var(--ink-3); font: 500 11px var(--font-body); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; margin-top: 10px; font-size: .78rem; color: var(--ink-2); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.f-close { fill: var(--ok); background: var(--ok); }
.f-ask { fill: var(--ask); background: var(--ask); }
.f-esc { fill: var(--crit); background: var(--crit); }
.f-none { fill: var(--idle); background: var(--idle); }
.f-delivered { fill: var(--ok); background: var(--ok); }
.f-queued { fill: var(--warn); background: var(--warn); }
.f-failed { fill: var(--crit); background: var(--crit); }
.f-never { fill: color-mix(in srgb, var(--crit) 55%, var(--ink)); background: color-mix(in srgb, var(--crit) 55%, var(--ink)); }
.f-unknown { fill: var(--idle); background: var(--idle); }
.f-ok2 { fill: color-mix(in srgb, var(--ok) 55%, var(--ink)); background: color-mix(in srgb, var(--ok) 55%, var(--ink)); }
.f-info { fill: var(--accent); background: var(--accent); }
.hops { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: .74rem; color: var(--ink-3); margin-top: 8px; }
.hops span { border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; font-family: var(--font-mono); font-size: .7rem; color: var(--ink-2); }

/* bar lists */
.bars { display: grid; gap: 7px; }
.bars .row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; font-size: .82rem; }
.bars .track { grid-column: 1 / -1; height: 5px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.bars .fill { height: 100%; background: var(--accent); border-radius: 3px; }

/* tables */
.table-wrap { overflow-x: auto; margin-inline: -18px; padding-inline: 18px; }
table { width: 100%; border-collapse: collapse; font-size: .84rem; }
th { text-align: left; font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; padding: 6px 10px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr:last-child td { border-bottom: 0; }
tr.click { cursor: pointer; }
tr.click:hover td, tr.sel td { background: var(--surface-2); }
td.nowrap, th.nowrap { white-space: nowrap; }
.ticket { font-family: var(--font-mono); font-weight: 500; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { font-family: var(--font-mono); font-size: .72rem; padding: 1px 6px; border-radius: 4px; background: var(--surface-2); color: var(--ink-2); white-space: nowrap; }
.chip.ok { background: var(--ok-soft); color: var(--ok); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.crit { background: var(--crit-soft); color: var(--crit); }
.chip.ask { background: var(--ask-soft); color: var(--ask); }
.mark { display: inline-block; font-size: .68rem; font-weight: 600; letter-spacing: .04em; padding: 0 5px; border-radius: 3px; text-transform: uppercase; }
.mark.stop { background: var(--warn-soft); color: var(--warn); }
.mark.fb { background: var(--accent-soft); color: var(--accent); }
.mark.err { background: var(--crit-soft); color: var(--crit); }
.empty { padding: 26px 8px; text-align: center; color: var(--ink-3); }

/* filters & forms */
.filters { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; margin-bottom: 14px; }
.field { display: grid; gap: 3px; }
.field label { font-size: .7rem; text-transform: uppercase; letter-spacing: .07em; color: var(--ink-3); font-weight: 600; }
select, input[type="text"], input[type="search"], textarea { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 6px 9px; min-height: 34px; max-width: 100%; }
textarea { min-height: 70px; width: 100%; resize: vertical; }
.btn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 6px 12px; min-height: 34px; cursor: pointer; font-weight: 600; font-size: .84rem; text-decoration: none; color: var(--ink); }
.btn:hover { border-color: var(--ink-3); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--surface); }
.btn.danger { background: var(--crit); border-color: var(--crit); color: var(--surface); }
.btn.good { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
.seg { justify-self: start; display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; flex-wrap: wrap; }
.seg label { padding: 6px 12px; cursor: pointer; font-weight: 600; font-size: .84rem; border-right: 1px solid var(--line); }
.seg label:last-child { border-right: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg input:checked + span { color: var(--accent); }
.seg label:has(input:checked) { background: var(--accent-soft); }
.seg input:focus-visible + span { outline: 2px solid var(--accent); outline-offset: 2px; }
.pager { display: flex; gap: 8px; align-items: center; justify-content: flex-end; margin-top: 12px; font-size: .82rem; color: var(--ink-2); }

/* detail */
.dl { display: grid; grid-template-columns: max-content minmax(0, 1fr); gap: 6px 16px; font-size: .86rem; margin: 0; }
.dl dt { color: var(--ink-3); }
.dl dd { margin: 0; min-width: 0; }
.reply { background: var(--surface-2); border-radius: var(--radius); padding: 12px 14px; white-space: pre-wrap; overflow-wrap: anywhere; font-size: .88rem; line-height: 1.55; }
.reply.posted { border-left: 3px solid var(--ok); border-radius: 0 var(--radius) var(--radius) 0; }
.tok { font-family: var(--font-mono); font-size: .78em; background: var(--accent-soft); color: var(--accent); border-radius: 3px; padding: 0 4px; white-space: nowrap; }
.acct { display: grid; gap: 4px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.attachment { display: grid; gap: 4px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.attachment:last-child { border-bottom: 0; padding-bottom: 0; }
.acct:last-child { border-bottom: 0; }
.meter { height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; width: 120px; display: inline-block; vertical-align: middle; margin-left: 8px; }
.meter > i { display: block; height: 100%; background: var(--accent); }
.note { border-left: 3px solid var(--warn); background: var(--warn-soft); color: var(--ink); padding: 8px 12px; border-radius: 0 var(--radius) var(--radius) 0; font-size: .85rem; }
details.msg { border: 1px solid var(--line); border-radius: var(--radius); margin-top: 8px; background: var(--surface); }
details.msg > summary { cursor: pointer; padding: 7px 10px; font-size: .8rem; font-weight: 600; color: var(--ink-2); list-style-position: inside; }
details.msg pre { margin: 0; padding: 10px 12px; border-top: 1px solid var(--line); font: .74rem/1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 420px; overflow: auto; }
.role { font-size: .68rem; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.role.model { color: var(--accent); }
.role.tool { color: var(--ok); }
.role.err { color: var(--crit); }
.review-box { display: grid; gap: 10px; }
.review-item { font-size: .82rem; padding: 8px 0; border-top: 1px solid var(--line); }

/* controls */
.control { display: grid; gap: 10px; }
.confirm { border: 1px solid var(--line); background: var(--surface-2); border-radius: var(--radius); padding: 12px; display: grid; gap: 10px; }
.big-state { display: flex; gap: 14px; align-items: center; flex-wrap: wrap; }
.big-state b { font-family: var(--font-display); font-stretch: 80%; font-size: 1.6rem; }

.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 9px 16px; border-radius: var(--radius); font-size: .85rem; box-shadow: var(--shadow); z-index: 20; max-width: calc(100% - 32px); }
.error-box { border: 1px solid var(--crit); background: var(--crit-soft); color: var(--ink); border-radius: var(--radius); padding: 12px 14px; }
.loading { color: var(--ink-3); padding: 30px 0; }

.grid-even { display: grid; gap: 18px; grid-template-columns: repeat(2, minmax(0, 1fr)); }
@media (max-width: 1100px) { .grid-2, .grid-even { grid-template-columns: minmax(0, 1fr); } }
@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  .rail { position: static; height: auto; flex-direction: row; flex-wrap: wrap; align-items: center; padding: 10px 16px; border-right: 0; border-bottom: 1px solid var(--line); gap: 10px; }
  .nav { flex-direction: row; overflow-x: auto; width: 100%; gap: 4px; }
  .desks { grid-auto-flow: column; overflow-x: auto; width: 100%; }
  .desks a { white-space: nowrap; }
  .nav a { white-space: nowrap; padding: 6px 10px; }
  .rail-foot { display: none; }
  .main { padding-inline: 16px; }
  .kpi b { font-size: 1.5rem; }
}
/* approval desk: queue | how the agent got there | the proposed reply */
.desk { display: grid; gap: 16px; grid-template-columns: minmax(220px, 280px) minmax(0, 1fr) minmax(300px, 400px); align-items: start; }
.desk > * { min-width: 0; }
.desk-col { display: grid; gap: 14px; align-content: start; }
.desk-side { position: sticky; top: 76px; }
.qlist { display: grid; gap: 6px; }
.qitem { display: grid; gap: 4px; text-align: left; width: 100%; border: 1px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 9px 11px; cursor: pointer; }
.qitem:hover { border-color: var(--ink-3); }
.qitem[aria-current="true"] { border-color: var(--accent); box-shadow: inset 3px 0 0 var(--accent); background: var(--accent-soft); }
.qitem .top { display: flex; justify-content: space-between; gap: 8px; align-items: center; }
.qitem .why { font-size: .76rem; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.steps { display: grid; gap: 0; position: relative; }
.step { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 10px; padding-bottom: 14px; position: relative; }
.step::before { content: ""; position: absolute; left: 10px; top: 20px; bottom: 0; width: 2px; background: var(--line); }
.step:last-child::before { display: none; }
.step .n { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font: 600 .7rem var(--font-mono); background: var(--surface-2); color: var(--ink-2); border: 1px solid var(--line); z-index: 1; }
.step.tool .n { background: var(--ok-soft); color: var(--ok); border-color: transparent; }
.step.think .n { background: var(--accent-soft); color: var(--accent); border-color: transparent; }
.step.fail .n { background: var(--crit-soft); color: var(--crit); border-color: transparent; }
.step .body { min-width: 0; display: grid; gap: 6px; }
.step .body p { margin: 0; font-size: .86rem; }
.io { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); }
.io pre { margin: 0; background: var(--surface-2); border-radius: var(--radius); padding: 8px 10px; font: .72rem/1.5 var(--font-mono); white-space: pre-wrap; overflow-wrap: anywhere; max-height: 240px; overflow: auto; }
.why-box { border-left: 3px solid var(--ask); background: var(--ask-soft); padding: 8px 12px; border-radius: 0 var(--radius) var(--radius) 0; font-size: .84rem; }
textarea.edit { width: 100%; min-height: 170px; font: .86rem/1.55 var(--font-mono); border: 1px solid var(--accent); border-radius: var(--radius); padding: 10px 12px; background: var(--surface); resize: vertical; }
.actions-row { display: flex; flex-wrap: wrap; gap: 8px; }
kbd { font: 600 .68rem var(--font-mono); border: 1px solid currentColor; border-bottom-width: 2px; border-radius: 4px; padding: 0 4px; opacity: .8; }
.live { display: grid; gap: 4px; font-size: .8rem; }
.live .now { font-weight: 600; }
.live ol { margin: 0; padding-left: 18px; color: var(--ink-2); font-family: var(--font-mono); font-size: .74rem; }
.palette-back { position: fixed; inset: 0; background: color-mix(in srgb, var(--ink) 35%, transparent); z-index: 30; display: grid; justify-items: center; align-items: start; padding: 12vh 16px 16px; }
.palette { width: min(560px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 20px 50px rgb(0 0 0 / .25); overflow: hidden; }
.palette input { width: 100%; border: 0; border-bottom: 1px solid var(--line); padding: 14px 16px; font-size: 1rem; background: var(--surface); outline: none; }
.palette ul { list-style: none; margin: 0; padding: 6px; max-height: 50vh; overflow: auto; }
.palette li a { display: flex; justify-content: space-between; gap: 10px; padding: 8px 10px; border-radius: var(--radius); color: var(--ink); text-decoration: none; }
.palette li a[aria-selected="true"], .palette li a:hover { background: var(--accent-soft); color: var(--accent); }

</style>

        <circle cx="11" cy="16" r="1.3" fill="var(--accent)"/><circle cx="15" cy="16" r="1.3" fill="var(--accent)"/><circle cx="19" cy="16" r="1.3" fill="var(--accent)"/>

<script>
"use strict";
/* ---------------- data access ---------------- */
const SERVED = !!document.querySelector('meta[name="portal"][content="served"]');
const DEMO_EL = document.getElementById("demo-data");
const DEMO = !SERVED && DEMO_EL ? JSON.parse(DEMO_EL.textContent) : null;
/* The desk being shown: ?desk=… in the address, else the last one used, else the first. */
let DESK = null, V = null;
const SERVICE_PATH = "/api/service";
function deskPath(path) {
  if (path.startsWith(SERVICE_PATH) || !path.startsWith("/api/")) return path;
  return `/api/d/${encodeURIComponent(DESK)}/` + path.slice(5);
}
const S = { service: null, session: null, route: "overview", id: null, filters: { days: "14", action: "", mode: "", status: "", flag: "", review: "", q: "" }, offset: 0, timer: null };

class ApiError extends Error { constructor(status, msg) { super(msg); this.status = status; } }

async function apiGet(path) {
  if (DEMO) return path.startsWith(SERVICE_PATH) ? demoService() : demoGet(path);
  if (!SERVED) throw new ApiError(0, "This page has to be opened from the console on the agent server (python -m nmbz portal).");
  const res = await fetch(deskPath(path), { headers: { Accept: "application/json" }, credentials: "same-origin" });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new ApiError(res.status, body.error || res.statusText);
  return body;
}
async function apiPost(path, payload) {
  if (DEMO) return path.startsWith(SERVICE_PATH) ? demoServicePost(payload) : demoPost(path, payload);
  const res = await fetch(deskPath(path), { method: "POST", credentials: "same-origin",
    headers: { "Content-Type": "application/json", "X-Portal-Request": "1", Accept: "application/json" },
    body: JSON.stringify(payload) });
  const body = await res.json().catch(() => ({}));
  if (!res.ok) throw new ApiError(res.status, body.error || res.statusText);
  return body;
}

/* demo mode: answers from the embedded snapshot; edits stay in this browser tab */
function demoService() {
  const svc = DEMO.service;
  return { ...svc, paused: !!DEMO_SVC.paused,
    desks: svc.desks.map(x => x.key === DESK ? { ...x, ...ds().session, approvals_pending: (ds().session.approvals_pending ?? x.approvals_pending) } : x) };
}
const DEMO_SVC = { paused: false };
function demoServicePost(body) {
  DEMO_SVC.paused = !!body.pause;
  ds().events.unshift({ created_at: new Date().toISOString(), actor: DEMO.service.user, action: body.pause ? "pause every desk" : "resume every desk", detail: body.note || "" });
  return demoService();
}
function demoGet(path) {
  const url = new URL(path, "https://demo.local");
  const p = Object.fromEntries(url.searchParams);
  const d = DEMO.desks[DESK];
  if (url.pathname === "/api/session") return { ...d.session, ...ds().session };
  if (url.pathname === "/api/overview") return d.overview;
  if (url.pathname === "/api/queue") return d.queue;
  if (url.pathname === "/api/runs") return d.runs;
  if (url.pathname === "/api/anomalies") return d.anomalies;
  const am = url.pathname.match(/^\/api\/anomalies\/(\d+)$/);
  if (am) { const rep = (d.anomaly_reports || {})[am[1]]; if (!rep) throw new ApiError(404, "No report with that id."); return { ...d.anomalies, report: rep }; }
  if (url.pathname === "/api/notifications") {
    const items = d.notifications.items.filter(n => !p.status || n.status === p.status);
    return { ...d.notifications, items, retryable: ds().retried ? 0 : d.notifications.retryable };
  }
  if (url.pathname === "/api/quality") return d.quality;
  if (url.pathname === "/api/live") return d.live || { running: false };
  if (url.pathname === "/api/approvals") {
    const all = (d.approvals || { pending: [], decided: [] });
    const decided = Object.values(ds().approvals);
    return { ...all, can_decide: true, approval_mode: d.session.approval_mode,
             pending: all.pending.filter(a => !ds().approvals[a.id]), decided: [...decided, ...all.decided] };
  }
  if (url.pathname === "/api/controls") return { ...d.controls, ...ds().controls, events: [...ds().events, ...d.controls.events] };
  const m = url.pathname.match(/^\/api\/decisions\/(\d+)$/);
  if (m) {
    const det = d.details[m[1]] || d.decisions.find(x => String(x.id) === m[1]);
    if (!det) throw new ApiError(404, "No decision with that id.");
    return { reason: "", evidence: [], transcript: [], history: [], reviews: [], tools_used: [], attachments: [], ...det,
             reviews: [...(ds().reviews[m[1]] || []), ...(det.reviews || [])] };
  }
  if (url.pathname === "/api/decisions") {
    let items = d.decisions.filter(x => (p.mode ? x.mode === p.mode : x.mode !== "audit"));
    const cutoff = Date.now() - Number(p.days || 14) * 864e5;
    items = items.filter(x => new Date(x.created_at).getTime() >= cutoff);
    if (p.action === "held") items = items.filter(isHeld);
    else if (p.action) items = items.filter(x => x.final_action === p.action && !isHeld(x));
    if (p.status) items = items.filter(x => Object.values(x.statuses || {}).includes(p.status));
    if (p.q) items = items.filter(x => String(x.ticket_number).includes(p.q));
    if (p.flag === "guardrail") items = items.filter(x => x.guardrail_changed);
    if (p.flag === "fallback") items = items.filter(x => x.category === "rules_fallback");
    if (p.flag === "error") items = items.filter(x => x.error);
    if (p.review === "unreviewed") items = items.filter(x => !x.review && !ds().reviews[x.id]);
    if (p.review === "correct" || p.review === "incorrect") items = items.filter(x => x.review === p.review);
    const offset = Number(p.offset || 0), limit = Number(p.limit || 50);
    return { total: items.length, limit, offset, items: items.slice(offset, offset + limit) };
  }
  throw new ApiError(404, "Not found.");
}
const DEMO_STATES = {};  /* edits made in the demo, per desk */
const ds = () => DEMO_STATES[DESK] || (DEMO_STATES[DESK] = { session: {}, controls: {}, events: [], reviews: {}, approvals: {} });
function demoPost(path, body) {
  const am = path.match(/^\/api\/approvals\/(\d+)$/);
  if (am) {
    const a = (DEMO.desks[DESK].approvals.pending || []).find(x => String(x.id) === am[1]);
    if (!a || ds().approvals[a.id]) throw new ApiError(409, "This reply is no longer waiting.");
    const edited = body.reply != null && body.reply.trim() !== (a.reply_masked || "").trim();
    const done = { ...a, status: body.verdict === "approve" ? "approved" : "rejected", decided_by: DEMO.desks[DESK].session.user,
                   decided_at: new Date().toISOString(), comment: body.comment || null, edited: edited ? 1 : 0,
                   reply_masked: edited ? body.reply.trim() : a.reply_masked };
    ds().approvals[a.id] = done;
    ds().session.approvals_pending = Math.max(0, (DEMO.desks[DESK].session.approvals_pending || 0) - Object.keys(ds().approvals).length);
    return done;
  }
  const m = path.match(/^\/api\/decisions\/(\d+)\/reviews$/);
  if (m) {
    const review = { id: Date.now(), decision_id: Number(m[1]), created_at: new Date().toISOString(), reviewer: DEMO.desks[DESK].session.user,
                     verdict: body.verdict, expected_action: body.expected_action || null, comment: body.comment || null };
    (ds().reviews[m[1]] = ds().reviews[m[1]] || []).unshift(review);
    return review;
  }
  if (path === "/api/notifications/retry") { const n = ds().retried ? 0 : DEMO.desks[DESK].notifications.retryable; ds().retried = true; return { requeued: n }; }
  if (path === "/api/controls") {
    const c = ds().controls;
    const now = new Date().toISOString();
    if ("kill_switch" in body) { c.kill_switch = !!body.kill_switch; ds().session.kill_switch = c.kill_switch;
      ds().events.unshift({ created_at: now, actor: DEMO.desks[DESK].session.user, action: body.kill_switch ? "pause" : "resume", detail: body.note || "" }); }
    if ("mode_override" in body) {
      c.mode_override = body.mode_override || null;
      c.effective_mode = c.mode_override || DEMO.desks[DESK].controls.configured_mode;
      ds().session.effective_mode = c.effective_mode;
      ds().events.unshift({ created_at: now, actor: DEMO.desks[DESK].session.user, action: c.mode_override ? `hold at ${c.mode_override}` : "release mode hold", detail: body.note || "" });
    }
    return demoGet("/api/controls");
  }
  throw new ApiError(404, "Not found.");
}

/* ---------------- vocabulary ---------------- */
const ACTIONS = {
  reply_and_close: { label: "Replied & closed", short: "Closed", cls: "ok", fill: "f-close" },
  request_info: { label: "Asked the owner", short: "Asked", cls: "ask", fill: "f-ask" },
  escalate: { label: "Escalated to staff", short: "Escalated", cls: "crit", fill: "f-esc" },
  no_action: { label: "No action", short: "None", cls: "idle", fill: "f-none" },
};
let STATUS = {};  /* the desk's status labels, from the service (see setDesk) */
const MODES = { live: ["ok", "Live"], notes: ["ask", "Notes only"], shadow: ["idle", "Shadow"], audit: ["idle", "Audit replay"] };

/* ---------------- helpers ---------------- */
const $ = (sel, root = document) => root.querySelector(sel);
const esc = v => String(v ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const tokens = text => esc(text).replace(/&lt;(MOBILE|NUMBER|EMAIL|NATIONAL_ID)_(\d+)&gt;/g, (_, k, n) => `<span class="tok" title="Masked value, filled in when posted">${k.toLowerCase().replace("_", " ")} ${n}</span>`);
const fmtInt = n => (n == null ? "–" : Number(n).toLocaleString("en-GB"));
const pct = (a, b) => (b ? Math.round((a / b) * 100) + "%" : "–");
function when(iso) {
  if (!iso) return "–";
  const d = new Date(iso);
  return d.toLocaleString("en-GB", { day: "2-digit", month: "short", hour: "2-digit", minute: "2-digit" });
}
function ago(iso) {
  if (!iso) return "never";
  const m = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (m < 1) return "just now";
  if (m < 60) return `${m} min ago`;
  const h = Math.round(m / 60);
  return h < 48 ? `${h} h ago` : `${Math.round(h / 24)} days ago`;
}
const actionPill = a => { const x = ACTIONS[a] || { label: a || "–", cls: "idle" }; return `<span class="pill ${x.cls}"><span class="dot"></span>${esc(x.label)}</span>`; };
const HELD = { label: "Waiting for approval", short: "Waiting", cls: "warn" };
/* A reply held in Approvals is not an outcome yet: the posted reply (or the escalation, if rejected) is recorded again. */
const isHeld = d => Boolean(d && (d.held || (d.executed || []).includes("awaiting approval")));
const outcomePill = d => d.error ? `<span class="pill crit">Error</span>`
  : isHeld(d) ? `<span class="pill ${HELD.cls}" title="Held in Approvals; nothing posted yet"><span class="dot"></span>${HELD.label}</span>`
  : actionPill(d.final_action);
const statusChip = s => { const [cls, text] = STATUS[s] || ["", s]; return `<span class="chip ${cls}" title="${esc(text)}">${esc(s)}</span>`; };
const statusChips = map => { const v = Object.values(map || {}); return v.length ? `<span class="chips">${v.map(statusChip).join("")}</span>` : `<span class="faint">–</span>`; };
const MAIL = { sent: ["ok", "sent"], pending: ["warn", "waiting"], failed: ["crit", "failed"], skipped: ["", "not sent"] };
const mailChip = st => { const [cls, label] = MAIL[st] || ["", st]; return `<span class="chip ${cls}">${esc(label)}</span>`; };
const modeChip = m => { const [cls, label] = MODES[m] || ["idle", m]; return `<span class="pill ${cls}">${esc(label)}</span>`; };
const ticketLink = (num, id) => {
  const tpl = S.session && S.session.osticket_ticket_url;
  const text = `#${esc(num)}`;
  return tpl ? `<a class="ticket" href="${esc(tpl.replace("{ticket_id}", id).replace("{number}", num))}" target="_blank" rel="noopener">${text}</a>` : `<span class="ticket">${text}</span>`;
};
function marks(d) {
  const out = [];
  if (d.guardrail_changed) out.push(`<span class="mark stop" title="Safety rules changed the model's proposal">stopped</span>`);
  if (d.category === "rules_fallback") out.push(`<span class="mark fb" title="Claude was unreachable; decided by the rules">rules</span>`);
  if (d.error) out.push(`<span class="mark err">error</span>`);
  if (d.deferred) out.push(`<span class="mark stop">retry</span>`);
  return out.join(" ");
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.hidden = false;
  clearTimeout(toast._t); toast._t = setTimeout(() => (t.hidden = true), 3200);
}
function errorBox(err) {
  return `<div class="error-box"><b>Could not load this page.</b><br>${esc(err.message || err)}</div>`;
}

/* ---------------- charts ---------------- */
function chartWidth() {
  const vw = window.innerWidth || 1280;
  const w = vw <= 760 ? vw - 32 - 38 : vw <= 1100 ? vw - 216 - 56 - 38 : (Math.min(vw, 1900) - 216 - 56 - 18) / 2 - 38;
  return Math.max(300, Math.round(w));
}
function stackedBars(rows, series, opts = {}) {
  const W = chartWidth(), H = opts.height || 200, padL = 30, padB = 22, padT = 8;
  const n = rows.length || 1;
  const totals = rows.map(r => series.reduce((s, k) => s + (r[k.key] || 0), 0));
  const raw = Math.max(1, ...totals);
  const step = raw <= 5 ? 1 : raw <= 10 ? 2 : raw <= 25 ? 5 : raw <= 50 ? 10 : Math.ceil(raw / 50) * 10;
  const max = Math.ceil(raw / step) * step;
  const y = v => H - padB - (v / max) * (H - padB - padT);
  const bw = (W - padL) / n;
  let out = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label || "chart")}">`;
  for (let v = 0; v <= max; v += step) {
    out += `<line class="grid" x1="${padL}" x2="${W}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${padL - 6}" y="${y(v) + 3}" text-anchor="end">${v}</text>`;
  }
  rows.forEach((r, i) => {
    let acc = 0;
    const x = padL + i * bw + bw * 0.18, w = Math.max(2, bw * 0.64);
    series.forEach(k => {
      const v = r[k.key] || 0;
      if (!v) return;
      out += `<rect class="${k.fill}" x="${x.toFixed(1)}" y="${y(acc + v).toFixed(1)}" width="${w.toFixed(1)}" height="${(y(acc) - y(acc + v)).toFixed(1)}" rx="1.5"><title>${esc(r.day)} · ${esc(k.label)}: ${v}</title></rect>`;
      acc += v;
    });
    const every = Math.max(1, Math.ceil(n / Math.max(3, Math.floor(W / 64))));
    if (i % every === 0 || i === n - 1) {
      let label;
      if (opts.labelFn) label = opts.labelFn(r, i);
      else { const dd = new Date(r.day + "T12:00:00"); label = `${dd.getDate()}/${dd.getMonth() + 1}`; }
      out += `<text class="axis" x="${(padL + i * bw + bw / 2).toFixed(1)}" y="${H - 6}" text-anchor="middle">${esc(label)}</text>`;
    }
  });
  if (opts.refLine != null && opts.refLine <= max) {
    out += `<line x1="${padL}" x2="${W}" y1="${y(opts.refLine)}" y2="${y(opts.refLine)}" stroke="var(--ink-2)" stroke-dasharray="4 4" stroke-width="1.2"/>
      <text class="axis" x="${padL + 4}" y="${y(opts.refLine) - 4}" text-anchor="start" paint-order="stroke" stroke="var(--surface)" stroke-width="3">${esc(opts.refLabel || "usual")}</text>`;
  }
  return out + "</svg>";
}
const legend = series => `<div class="legend">${series.map(k => `<span><i class="${k.fill}"></i>${esc(k.label)}</span>`).join("")}</div>`;
function barList(items, labelFn, valueKey = "count") {
  if (!items.length) return `<p class="empty">Nothing in this period.</p>`;
  const max = Math.max(...items.map(i => i[valueKey]));
  return `<div class="bars">${items.map(i => `<div class="row"><span>${labelFn(i)}</span><b class="num">${fmtInt(i[valueKey])}</b><span class="track"><span class="fill" style="width:${(i[valueKey] / max) * 100}%"></span></span></div>`).join("")}</div>`;
}

/* ---------------- shell ---------------- */
function renderStrip() {
  const s = S.session; if (!s) return;
  const h = S.health || {};
  let agent;
  if (S.service && S.service.paused) agent = `<a class="pill warn" href="#controls" style="text-decoration:none"><span class="dot"></span>Every desk paused</a>`;
  else if (s.kill_switch) agent = `<span class="pill warn"><span class="dot"></span>Paused</span>`;
  else if (S.live && S.live.running) agent = `<a class="pill ok" href="#runs" style="text-decoration:none"><span class="dot"></span>Working${S.live.ticket_number ? ` on #${esc(S.live.ticket_number)}` : ""}${liveStep()}</a>`;
  else if (h.running) agent = `<span class="pill ok"><span class="dot"></span>Running a pass now</span>`;
  else if (h.stale) agent = `<span class="pill crit"><span class="dot"></span>No pass for ${h.minutes_since_last_run == null ? "a while" : Math.round(h.minutes_since_last_run) + " min"}</span>`;
  else agent = `<span class="pill ok"><span class="dot"></span>Healthy · last pass ${esc(ago(h.last_run && (h.last_run.finished_at || h.last_run.started_at)))}</span>`;
  const held = s.effective_mode !== s.configured_mode ? ` <span class="faint">(held from ${esc(s.configured_mode)})</span>` : "";
  const an = s.anomaly && s.anomaly.severity !== "ok" && (Date.now() - new Date(s.anomaly.created_at)) < 3 * 3600e3 ? s.anomaly : null;
  const anPill = an ? `<a class="pill ${an.severity === "incident" ? "crit" : "warn"}" href="#anomalies" style="text-decoration:none;white-space:normal"><span class="dot"></span>${an.severity === "incident" ? "Incident" : "Watch"}: ${esc(an.headline)}</a>` : "";
  $("#nav-anom").innerHTML = an ? `<span class="pill ${an.severity === "incident" ? "crit" : "warn"}" style="padding:0 7px;font-size:.7rem">${an.severity === "incident" ? "incident" : "watch"}</span>` : "";
  const waiting = s.approvals_pending ? `<a class="pill ask" href="#approvals" style="text-decoration:none"><span class="dot"></span>${s.approvals_pending} repl${s.approvals_pending === 1 ? "y" : "ies"} waiting for approval</a>` : "";
  $("#nav-approvals").textContent = s.approvals_pending || "";
  $("#strip").innerHTML = `${agent}${anPill}${waiting}<span class="pill outline">Mode&nbsp;${modeChip(s.effective_mode)}${held}</span>
    <span class="spacer"></span><span class="pill outline">${esc(s.user)} · ${esc(s.role)}</span>`;
  $("#rail-foot").innerHTML = `<span>Model <span class="mono">${esc(s.model)}</span></span><span>Posts as staff ${esc(s.reply_staff_id ?? "–")}</span>`;
}
function liveStep() {
  const steps = (S.live && S.live.steps) || [];
  const last = steps[steps.length - 1];
  return last ? ` · <span class="mono" style="font-weight:500">${tokens(last.text.length > 48 ? last.text.slice(0, 47) + "…" : last.text)}</span>` : "";
}
async function pollLive() {
  if (document.hidden) return;
  try {
    const was = S.live && S.live.running;
    S.live = await apiGet("/api/live");
    if (S.live.running || was) renderStrip();
    if (was && !S.live.running) { await loadSession(); if (["overview", "queue", "runs"].includes(S.route)) refreshQuiet(); }
    if (S.route === "runs" && $("#live-panel")) $("#live-panel").innerHTML = livePanel();
  } catch (_) { /* the live view is optional */ }
}
function livePanel() {
  const l = S.live || {};
  if (!l.running) return `<p class="faint" style="margin:0">Not running. The next pass starts on the 15-minute timer.</p>`;
  return `<div class="live"><div class="now">Run <span class="mono">${esc(l.run_id)}</span> · started ${esc(ago(l.started_at))}${l.ticket_number ? ` · ticket #${esc(l.ticket_number)} <span class="faint">(${esc(l.help_topic || "")})</span>` : ""}</div>
    ${(l.steps || []).length ? `<ol>${l.steps.map(st => `<li>${tokens(st.text)} <span class="faint">${esc(ago(st.at))}</span></li>`).join("")}</ol>` : `<span class="faint">Reading the ticket…</span>`}</div>`;
}
function setNav() {
  const current = S.route === "decision" ? "decisions" : S.route;
  document.querySelectorAll(".nav a").forEach(a => { if (a.dataset.route === current) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
}
function parseHash() {
  const h = (location.hash || "#overview").slice(1);
  const m = h.match(/^decision-(\d+)$/);
  const a = h.match(/^anomaly-(\d+)$/);
  if (m) { S.route = "decision"; S.id = m[1]; }
  else if (a) { S.route = "anomalies"; S.id = a[1]; }
  else { S.route = ["overview", "anomalies", "queue", "approvals", "decisions", "review", "emails", "runs", "controls"].includes(h) ? h : "overview"; S.id = null; }
}
async function render() {
  parseHash(); setNav();
  const view = $("#view");
  clearInterval(S.timer);
  try {
    const page = PAGES[S.route === "decision" ? "decision" : S.route];
    view.innerHTML = await page();
    if (["overview", "queue", "runs", "anomalies"].includes(S.route) && !S.id) S.timer = setInterval(() => { if (!document.hidden) refreshQuiet(); }, 60000);
    if (S.route === "approvals") afterApprovalsRender();
  } catch (err) {
    view.innerHTML = errorBox(err);
  }
}
async function refreshQuiet() {
  try { const html = await PAGES[S.route](); $("#view").innerHTML = html; await loadSession(); } catch (_) { /* keep the last view */ }
}
function pickDesk(service) {
  const keys = service.desks.map(x => x.key);
  let want = new URLSearchParams(location.search).get("desk");
  if (!keys.includes(want)) { try { want = localStorage.getItem("nmbz-desk"); } catch (_) { want = null; } }
  return keys.includes(want) ? want : keys[0];
}
function setDesk(key) {
  DESK = key;
  const desk = S.service.desks.find(x => x.key === key);
  V = desk.vocab; STATUS = V.status || {};
  try { localStorage.setItem("nmbz-desk", key); } catch (_) { /* remembering the desk is optional */ }
  $("#brand-desk").textContent = V.agent || desk.title;
  document.title = `${desk.title} · Helpdesk Agents Console`;
  renderDesks();
}
function deskHref(key) {
  const q = new URLSearchParams(location.search); q.set("desk", key);
  return `?${q.toString()}${location.hash || "#overview"}`;
}
function renderDesks() {
  const svc = S.service; if (!svc) return;
  $("#desks").innerHTML = svc.desks.length < 2 ? "" : svc.desks.map(x => {
    const badges = [];
    if (x.approvals_pending) badges.push(`<span class="badge ask" title="Replies waiting for approval">${x.approvals_pending}</span>`);
    if (x.anomaly && x.anomaly.severity && x.anomaly.severity !== "ok") badges.push(`<span class="badge ${x.anomaly.severity === "incident" ? "crit" : "warn"}" title="${esc(x.anomaly.headline || "")}">${x.anomaly.severity === "incident" ? "incident" : "watch"}</span>`);
    if (x.kill_switch || svc.paused) badges.push(`<span class="badge warn" title="Paused">paused</span>`);
    return `<a href="${deskHref(x.key)}" data-desk="${esc(x.key)}" ${x.key === DESK ? 'aria-current="true"' : ""}>${esc(x.title)}<span class="badges">${badges.join("")}</span></a>`;
  }).join("");
}
async function loadService() {
  S.service = await apiGet(SERVICE_PATH);
  if (!S.service.desks.length) throw new ApiError(0, "No desk is switched on (DESKS in the server's .env).");
  if (!DESK) setDesk(pickDesk(S.service)); else renderDesks();
}
async function loadSession() {
  try { await loadService(); } catch (err) { if (!S.service) throw err; }
  S.session = await apiGet("/api/session");
  try { S.health = (await apiGet("/api/overview?days=1")).health; } catch (_) { S.health = null; }
  renderStrip();
}

const SEV = { ok: ["ok", "Normal"], watch: ["warn", "Watch"], incident: ["crit", "Incident"] };
const ATTACH = { read: ["ok", "Read"], skipped: ["idle", "Skipped"], not_read: ["idle", "Not read"], failed: ["crit", "Could not read"], pending: ["idle", "Not read"] };
const attachChip = st => { const [cls, label] = ATTACH[st] || ["idle", st]; return `<span class="pill ${cls}">${esc(label)}</span>`; };
const fmtBytes = n => n == null ? "" : n >= 1048576 ? (n / 1048576).toFixed(1) + " MB" : Math.max(1, Math.round(n / 1024)) + " KB";
const sevPill = sv => { const [cls, label] = SEV[sv] || ["idle", sv]; return `<span class="pill ${cls}"><span class="dot"></span>${esc(label)}</span>`; };
function findingsTable(comp, emptyText) {
  if (!comp || !comp.findings || !comp.findings.length) return `<p class="empty">${esc(emptyText)}</p>`;
  const bar = (v, cls) => `<span class="track" style="display:inline-block;width:90px;height:6px;background:var(--surface-2);border-radius:3px;vertical-align:middle;overflow:hidden"><span class="${cls}" style="display:block;height:100%;width:${Math.round(v * 100)}%"></span></span>`;
  return `<div class="table-wrap"><table><thead><tr><th>Detail</th><th>Value</th><th>Share of failures</th><th>${esc(V.anomaly.ok_share_label)}</th><th class="num">More common</th></tr></thead><tbody>
  ${comp.findings.map(f => `<tr><td>${esc(f.label)}</td><td><b>${esc(f.value)}</b></td>
    <td class="nowrap num">${bar(f.failed_share, "f-failed")} ${Math.round(f.failed_share * 100)}% <span class="faint">(${f.failed_n})</span></td>
    <td class="nowrap num">${bar(f.ok_share, "f-delivered")} ${Math.round(f.ok_share * 100)}%</td>
    <td class="num">${f.ratio == null ? "only in failures" : f.ratio + "×"}</td></tr>`).join("")}</tbody></table></div>`;
}
/* consecutive reports with the same severity and the same set of signals form one row (history is newest first) */
const groupReports = history => {
  const groups = [];
  for (const h of history) {
    const g = groups[groups.length - 1];
    if (g && g.newest.severity === h.severity && (g.oldest.incident_key || "") === (h.incident_key || "")) { g.items.push(h); g.oldest = h; }
    else groups.push({ newest: h, oldest: h, items: [h] });
  }
  return groups;
};

function transcriptHtml(t) {
  if (!t || !t.length) return `<p class="faint">No model conversation (rules fallback or an automatic follow-up).</p>`;
  const parts = [];
  t.forEach((m, i) => {
    const blocks = typeof m.content === "string" ? [{ type: "text", text: m.content }] : (m.content || []);
    blocks.forEach(b => {
      if (b.type === "text") {
        const who = m.role === "assistant" ? `<span class="role model">Model</span>` : `<span class="role">${i === 0 ? "Ticket as the model saw it" : "Agent"}</span>`;
        parts.push(`<details class="msg" ${i === 0 ? "" : "open"}><summary>${who}</summary><pre>${tokens(b.text)}</pre></details>`);
      } else if (b.type === "tool_use") {
        parts.push(`<details class="msg" open><summary><span class="role model">Model called</span> <span class="mono">${esc(b.name)}</span></summary><pre>${tokens(JSON.stringify(b.input, null, 2))}</pre></details>`);
      } else if (b.type === "tool_result") {
        let body = b.content;
        try { body = JSON.stringify(JSON.parse(b.content), null, 2); } catch (_) { /* plain text */ }
        parts.push(`<details class="msg"><summary><span class="role ${b.is_error ? "err" : "tool"}">${b.is_error ? "Tool error" : "Tool result"}</span></summary><pre>${tokens(body)}</pre></details>`);
      }
    });
  });
  return parts.join("");
}

  const det = sel ? await apiGet(`/api/decisions/${encodeURIComponent(sel.decision_id)}`) : null;
  S.apprEdit = false; S.apprConfirm = null;
  const mode = a.approval_mode;
  const intro = mode === "all" ? "Every reply waits for approval (APPROVAL_MODE=all)."
    : mode === "off" ? "Approval is off (APPROVAL_MODE=off): the agent posts on its own."
    : "Standard outcomes are posted on their own; replies the agent reached another way wait here.";
  return `<div class="head"><div><h1>Approvals</h1><p>${intro} An approved reply is posted on the agent's next pass, as long as the ticket hasn't changed.</p></div>
    <span class="faint" style="font-size:.8rem"><kbd>J</kbd> <kbd>K</kbd> move · <kbd>A</kbd> approve · <kbd>E</kbd> edit · <kbd>X</kbd> reject · <kbd>?</kbd> keys</span></div>
  ${a.can_decide ? "" : `<div class="demo-banner">You can see what is waiting; only admins can approve or reject.</div>`}
  <div class="desk">
    <div class="desk-col desk-side">
      <section class="panel"><header><div><h2>Waiting</h2>${items.length ? `<p>${items.length} repl${items.length === 1 ? "y" : "ies"}, oldest first</p>` : ""}</div></header>
        ${items.length ? `<div class="qlist" id="qlist">${items.map(x => qItem(x, sel)).join("")}</div>` : `<p class="empty">Nothing is waiting.</p>`}</section>
      <section class="panel"><header><h2>Recently decided</h2></header>${recentApprovals(a.decided)}</section>
    </div>
    ${sel ? `<div class="desk-col">${traceHtml(det)}</div><div class="desk-col desk-right desk-side" id="proposal">${proposalHtml(det, sel, a.can_decide)}</div>`
      : `<div class="desk-col"><section class="panel"><p class="empty">When a reply needs a person, it shows here with every step the agent took to reach it.</p></section></div>`}
  </div>`;
};
function qItem(x, sel) {
  return `<button class="qitem" type="button" data-appr="${esc(x.id)}" aria-current="${sel && sel.id === x.id ? "true" : "false"}">
    <span class="top"><span class="mono" style="font-weight:600">#${esc(x.ticket_number)}</span>${actionPill(x.action)}</span>
    <span class="why">${tokens(x.why || "")}</span>
    <span class="faint" style="font-size:.72rem">${esc(ago(x.created_at))} · ${x.confidence == null ? "–" : Math.round(x.confidence * 100) + "%"}</span></button>`;
}
function recentApprovals(items) {
  if (!items.length) return `<p class="empty">None in the last 7 days.</p>`;
  return `<div class="table-wrap"><table><tbody>${items.slice(0, 20).map(x => `<tr class="click" data-href="#decision-${x.decision_id}">
    <td class="mono">#${esc(x.ticket_number)}</td><td>${approvalChip(x.status)}${x.edited ? ` <span class="chip">edited</span>` : ""}</td>
    <td class="faint">${esc(x.decided_by || "")}</td></tr>`).join("")}</tbody></table></div>`;
}
function traceSteps(t) {
  const results = {};
  (t || []).forEach(m => (typeof m.content === "string" ? [] : m.content || []).forEach(b => { if (b.type === "tool_result") results[b.tool_use_id] = b; }));
  const steps = [];
  (t || []).forEach(m => {
    if (m.role !== "assistant") return;
    (m.content || []).forEach(b => {
      if (b.type === "text" && b.text.trim()) steps.push({ kind: "think", text: b.text });
      if (b.type === "tool_use" && b.name !== "submit_decision") steps.push({ kind: "tool", name: b.name, input: b.input, result: results[b.id] });
      if (b.type === "tool_use" && b.name === "submit_decision") steps.push({ kind: "decide", input: b.input });
    });
  });
  return steps;
}
function pretty(content) { try { return JSON.stringify(JSON.parse(content), null, 2); } catch (_) { return String(content || ""); } }
function traceHtml(d) {
  const first = (d.transcript || [])[0];
  const ticketText = first ? (typeof first.content === "string" ? first.content : (first.content || []).map(b => b.text || "").join("\n")) : "";
  const topic = (ticketText.match(/Help topic: ([^\n]+?)(?:\s{2,}|\n|$)/) || [])[1] || "";
  const steps = traceSteps(d.transcript);
  return `<section class="panel"><header><div><h2>Ticket ${ticketLink(d.ticket_number, d.ticket_id)}</h2><p>${topic ? `${esc(topic)} · ` : ""}decided ${esc(when(d.created_at))} · <a href="#decision-${d.id}">full decision</a></p></div></header>
      ${statusChips(d.statuses)}
      ${ticketText ? `<details class="msg"><summary><span class="role">The ticket as the agent read it</span></summary><pre>${tokens(ticketText)}</pre></details>` : ""}</section>
    <section class="panel"><header><div><h2>How the agent got here</h2><p>Each lookup it chose, what it sent and what came back. Numbers are masked.</p></div></header>
      ${steps.length ? `<div class="steps">${steps.map((st, i) => stepHtml(st, i + 1)).join("")}</div>` : `<p class="faint">No model conversation was recorded.</p>`}</section>
    <section class="panel"><header><h2>Reasoning</h2></header><p style="margin-top:0">${tokens(d.reason || "–")}</p>
      ${(d.evidence || []).length ? `<ul style="margin-bottom:0">${d.evidence.map(e => `<li>${tokens(e)}</li>`).join("")}</ul>` : ""}</section>`;
}
function stepHtml(st, n) {
  if (st.kind === "think") return `<div class="step think"><span class="n">${n}</span><div class="body"><p>${tokens(st.text)}</p></div></div>`;
  if (st.kind === "decide") {
    const x = st.input || {};
    return `<div class="step think"><span class="n">${n}</span><div class="body"><p><b>Decided</b> ${actionPill(x.action)} <span class="faint">${x.confidence == null ? "" : Math.round(x.confidence * 100) + "% confident"}${x.follows_standard_outcome === false ? " · says it went beyond the standard check" : ""}</span></p></div></div>`;
  }
  const failed = st.result && st.result.is_error;
  return `<div class="step ${failed ? "fail" : "tool"}"><span class="n">${n}</span><div class="body"><p><span class="mono" style="font-weight:600">${esc(st.name)}</span>${failed ? ` <span class="chip crit">error</span>` : ""}</p>
    <div class="io"><div><div class="label">Sent</div><pre>${tokens(JSON.stringify(st.input || {}, null, 2))}</pre></div>
    <div><div class="label">Came back</div><pre>${st.result ? tokens(pretty(st.result.content)) : "–"}</pre></div></div></div></div>`;
}
function proposalHtml(d, a, canDecide) {
  const dis = canDecide ? "" : "disabled";
  const conf = d.confidence == null ? 0 : Math.round(d.confidence * 100);
  return `<section class="panel" style="display:grid;gap:12px"><header style="margin-bottom:0"><h2>Proposed reply</h2>${actionPill(a.action)}</header>
    <div class="dl" style="grid-template-columns:max-content 1fr"><span class="faint">Confidence</span><span class="num">${conf}%<span class="meter"><i style="width:${conf}%"></i></span></span></div>
    <div class="why-box"><b>Why it waits:</b> ${tokens(a.why || "")}</div>
    <div><div class="label" style="margin-bottom:4px">To the branch${a.action === "reply_and_close" ? ", then the ticket closes" : ", ticket stays open"}</div>
      <div class="reply" id="appr-reply">${tokens(a.reply_masked || "")}</div>
      <textarea class="edit" id="appr-edit" hidden aria-label="Edit the reply">${esc(a.reply_masked || "")}</textarea>
      <p class="faint" id="appr-edit-hint" hidden style="font-size:.75rem;margin:4px 0 0">Keep masked values like &lt;MOBILE_1&gt; as they are; they are filled in when posted. New numbers can't be typed in.</p></div>
    <div class="field"><label for="appr-comment">Comment (kept in the log; on reject it goes into the note)</label><input type="text" id="appr-comment" maxlength="1000" ${dis}></div>
    <div id="appr-actions">${approvalButtons(dis)}</div>
  </section>`;
}
function approvalButtons(dis) {
  if (S.apprConfirm === "approve") return `<div class="confirm"><b>Post this reply on the next pass?</b><div class="actions-row"><button class="btn good" data-action="appr-approve-yes" id="appr-yes">Approve <kbd>Enter</kbd></button><button class="btn" data-action="appr-cancel">Cancel <kbd>Esc</kbd></button></div></div>`;
  if (S.apprConfirm === "reject") return `<div class="confirm"><b>Reject it?</b><span class="muted">Nothing is sent to the branch. The agent leaves an escalation note with your comment so a person handles the ticket.</span><div class="actions-row"><button class="btn danger" data-action="appr-reject-yes" id="appr-yes">Reject <kbd>Enter</kbd></button><button class="btn" data-action="appr-cancel">Cancel <kbd>Esc</kbd></button></div></div>`;
  return `<div class="actions-row"><button class="btn good" data-action="appr-approve" ${dis}>Approve <kbd>A</kbd></button>
    <button class="btn" data-action="appr-edit" ${dis}>${S.apprEdit ? "Stop editing" : "Edit"} <kbd>E</kbd></button>
    <button class="btn danger" data-action="appr-reject" ${dis}>Reject <kbd>X</kbd></button></div>`;
}
function afterApprovalsRender() { const cur = document.querySelector('.qitem[aria-current="true"]'); if (cur) cur.scrollIntoView({ block: "nearest" }); }
function setApprovalButtons() { const z = $("#appr-actions"); if (z) z.innerHTML = approvalButtons(S.appr && S.appr.can_decide ? "" : "disabled"); const y = $("#appr-yes"); if (y) y.focus(); }
function toggleEdit() {
  if (!$("#appr-edit") || !(S.appr && S.appr.can_decide)) return;
  S.apprEdit = !S.apprEdit;
  $("#appr-edit").hidden = !S.apprEdit; $("#appr-edit-hint").hidden = !S.apprEdit; $("#appr-reply").hidden = S.apprEdit;
  setApprovalButtons();
  if (S.apprEdit) $("#appr-edit").focus();
}
async function decideApproval(verdict) {
  const id = S.apprSel; if (!id) return;
  const body = { verdict, comment: ($("#appr-comment") || {}).value || "" };
  if (verdict === "approve" && S.apprEdit) body.reply = $("#appr-edit").value;
  try {
    await apiPost(`/api/approvals/${encodeURIComponent(id)}`, body);
    toast(verdict === "approve" ? "Approved. It is posted on the next pass." : "Rejected. The agent will leave an escalation note.");
    const items = (S.appr && S.appr.pending) || [];
    const i = items.findIndex(x => String(x.id) === String(id));
    const next = items[i + 1] || items[i - 1];
    S.apprSel = next ? next.id : null;
    await loadSession(); render();
  } catch (err) { S.apprConfirm = null; setApprovalButtons(); toast(err.message); }
}
function moveApproval(step) {
  const items = (S.appr && S.appr.pending) || [];
  if (!items.length) return;
  const i = Math.max(0, items.findIndex(x => String(x.id) === String(S.apprSel)));
  const next = items[Math.min(items.length - 1, Math.max(0, i + step))];
  if (next && next.id !== S.apprSel) { S.apprSel = next.id; render(); }
}

/* ---------------- palette and keys ---------------- */
const PAGE_LIST = [["overview", "Overview"], ["approvals", "Approvals"], ["queue", "Open tickets"], ["anomalies", "Anomalies"], ["decisions", "Decisions"],
  ["review", "Review"], ["emails", "Emails & alerts"], ["runs", "Runs"], ["controls", "Controls"]];
function closeOverlay() { $("#overlay").innerHTML = ""; S.palette = null; }
function openPalette() {
  $("#overlay").innerHTML = `<div class="palette-back" data-action="close-overlay"><div class="palette" role="dialog" aria-label="Go to">
    <input id="pal-q" placeholder="Ticket number or page…" autocomplete="off" aria-label="Ticket number or page">
    <ul id="pal-list" role="listbox"></ul><div class="hint"><span><kbd>↑</kbd> <kbd>↓</kbd> choose</span><span><kbd>Enter</kbd> open</span><span><kbd>Esc</kbd> close</span></div></div></div>`;
  S.palette = { items: [], sel: 0 };
  paletteSearch("");
  $("#pal-q").focus();
}
let palTimer;
async function paletteSearch(q) {
  const text = q.trim().toLowerCase();
  let items = PAGE_LIST.filter(([, label]) => !text || label.toLowerCase().includes(text)).map(([r, label]) => ({ href: `#${r}`, label, meta: "page" }));
  const digits = text.replace(/\D/g, "");
  if (digits.length >= 3) {
    try {
      const res = await apiGet(`/api/decisions?q=${encodeURIComponent(digits)}&days=365&limit=8`);
      const seen = new Set();
      items = res.items.filter(d => !seen.has(d.ticket_number) && seen.add(d.ticket_number))
        .map(d => ({ href: `#decision-${d.id}`, label: `Ticket #${d.ticket_number}`, meta: `${isHeld(d) ? HELD.short : (ACTIONS[d.final_action] || {}).short || d.final_action || ""} · ${when(d.created_at)}` })).concat(items);
    } catch (_) { /* pages only */ }
  }
  if (!S.palette) return;
  S.palette.items = items; S.palette.sel = 0;
  drawPalette();
}
function drawPalette() {
  const p = S.palette; if (!p || !$("#pal-list")) return;
  $("#pal-list").innerHTML = p.items.length ? p.items.map((it, i) => `<li><a href="${esc(it.href)}" role="option" aria-selected="${i === p.sel}" data-action="close-overlay">${esc(it.label)}<span class="faint">${esc(it.meta)}</span></a></li>`).join("")
    : `<li class="faint" style="padding:10px">No match. Ticket numbers search the last year of decisions.</li>`;
}
function showKeys() {
  $("#overlay").innerHTML = `<div class="palette-back" data-action="close-overlay"><div class="palette" role="dialog" aria-label="Keyboard shortcuts">
    <div class="keys"><kbd>Ctrl K</kbd><span>Go to a ticket or page</span><kbd>J</kbd><span>Approvals: next reply</span><kbd>K</kbd><span>Approvals: previous reply</span>
    <kbd>A</kbd><span>Approve (then Enter to confirm)</span><kbd>E</kbd><span>Edit the reply</span><kbd>X</kbd><span>Reject (then Enter to confirm)</span>
    <kbd>?</kbd><span>This list</span><kbd>Esc</kbd><span>Close, cancel or stop editing</span></div></div></div>`;
}
document.addEventListener("keydown", e => {
  if (S.palette) {
    const p = S.palette;
    if (e.key === "ArrowDown" || e.key === "ArrowUp") { e.preventDefault(); p.sel = Math.max(0, Math.min(p.items.length - 1, p.sel + (e.key === "ArrowDown" ? 1 : -1))); drawPalette(); return; }
    if (e.key === "Enter") { e.preventDefault(); const it = p.items[p.sel]; closeOverlay(); if (it) location.hash = it.href; return; }
  }
  if (e.key === "Escape") {
    if ($("#overlay").innerHTML) { closeOverlay(); return; }
    if (S.apprConfirm) { S.apprConfirm = null; setApprovalButtons(); return; }
    if (S.apprEdit) { toggleEdit(); return; }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openPalette(); return; }
  if (e.ctrlKey || e.metaKey || e.altKey || $("#overlay").innerHTML) return;
  if (e.target.closest && e.target.closest("input, textarea, select, [contenteditable]")) return;
  if (e.key === "?") { showKeys(); return; }
  if (S.route !== "approvals" || !S.apprSel) return;
  const k = e.key.toLowerCase();
  if (k === "j" || k === "k") { e.preventDefault(); moveApproval(k === "j" ? 1 : -1); }
  else if (S.appr && S.appr.can_decide && (k === "a" || k === "x")) { e.preventDefault(); S.apprConfirm = k === "a" ? "approve" : "reject"; setApprovalButtons(); }
  else if (k === "e") { e.preventDefault(); toggleEdit(); }
});
document.addEventListener("input", e => {
  if (e.target.id === "pal-q") { clearTimeout(palTimer); const v = e.target.value; palTimer = setTimeout(() => paletteSearch(v), 180); }
});

/* ---------------- events ---------------- */
document.addEventListener("click", async e => {
  const row = e.target.closest("tr[data-href]");
  if (row && !e.target.closest("a")) { location.hash = row.dataset.href; return; }
  const pageBtn = e.target.closest("[data-page]");
  if (pageBtn) { S.offset = Math.max(0, S.offset + Number(pageBtn.dataset.page) * 50); render(); return; }
  const q = e.target.closest("[data-appr]");
  if (q) { S.apprSel = Number(q.dataset.appr); render(); return; }
  const act = e.target.closest("[data-action]");
  if (!act || act.disabled) return;
  if (act.dataset.action === "close-overlay") { if (e.target === act || act.tagName === "A") closeOverlay(); return; }
  if (act.dataset.action === "appr-approve" || act.dataset.action === "appr-reject") { S.apprConfirm = act.dataset.action === "appr-approve" ? "approve" : "reject"; setApprovalButtons(); return; }
  if (act.dataset.action === "appr-cancel") { S.apprConfirm = null; setApprovalButtons(); return; }
  if (act.dataset.action === "appr-edit") { toggleEdit(); return; }
  if (act.dataset.action === "appr-approve-yes" || act.dataset.action === "appr-reject-yes") { decideApproval(act.dataset.action === "appr-approve-yes" ? "approve" : "reject"); return; }
  const note = ($("#ctl-note") || {}).value || "";
  try {
    if (act.dataset.action === "ask-pause") {
      $("#pause-zone").innerHTML = `<div class="confirm"><b>Pause the agent?</b><span class="muted">Tickets stay open and untouched until someone resumes it.</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn danger" data-action="pause">Pause now</button><button class="btn" data-action="cancel">Cancel</button></div></div>`;
      return;
    }
    if (act.dataset.action === "ask-pause-all") {
      $("#pause-all-zone").innerHTML = `<div class="confirm"><b>Pause every desk?</b><span class="muted">No desk starts a new pass. Tickets stay open and untouched until someone resumes the service.</span>
        <div style="display:flex;gap:8px;flex-wrap:wrap"><button class="btn danger" data-action="pause-all">Pause every desk</button><button class="btn" data-action="cancel">Cancel</button></div></div>`;
      return;
    }
    if (act.dataset.action === "pause-all" || act.dataset.action === "resume-all") {
      S.service = await apiPost(`${SERVICE_PATH}/controls`, { pause: act.dataset.action === "pause-all", note });
      toast(act.dataset.action === "pause-all" ? "Every desk paused" : "Every desk resumed");
      renderDesks(); renderStrip(); render(); return;
    }
    if (act.dataset.action === "cancel") { render(); return; }
    if (act.dataset.action === "pause" || act.dataset.action === "resume") {
      await apiPost("/api/controls", { kill_switch: act.dataset.action === "pause", note });
      toast(act.dataset.action === "pause" ? "Agent paused" : "Agent resumed");
    }
    if (act.dataset.action === "copy-branch") {
      const text = $("#branch-msg").textContent;
      try { await navigator.clipboard.writeText(text); toast("Copied"); }
      catch (_) { const range = document.createRange(); range.selectNodeContents($("#branch-msg")); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(range); toast("Press Ctrl+C to copy"); }
      return;
    }
    if (act.dataset.action === "retry-mail") {
      const res = await apiPost("/api/notifications/retry", {});
      toast(`${res.requeued} email(s) will be re-sent on the next pass`);
    }
    if (act.dataset.action === "save-hold") {
      const v = (document.querySelector('input[name="hold"]:checked') || {}).value || "";
      await apiPost("/api/controls", { mode_override: v || null, note });
      toast(v ? `Agent held at ${v}` : "Mode hold released");
    }
    await loadSession(); render();
  } catch (err) { toast(err.message); }
});
document.addEventListener("change", e => {
  const f = e.target.dataset && e.target.dataset.filter;
  if (f) { S.filters[f] = e.target.value; S.offset = 0; render(); }
  if (e.target.dataset && e.target.dataset.mailFilter) { S.mailStatus = e.target.value; render(); }
  if (e.target.name === "verdict") $("#rv-expected").hidden = e.target.value !== "incorrect";
});
let searchTimer;
document.addEventListener("input", e => {
  if (e.target.id === "f-q") { clearTimeout(searchTimer); searchTimer = setTimeout(() => { S.filters.q = e.target.value.trim(); S.offset = 0; render().then(() => { const i = $("#f-q"); if (i) { i.focus(); i.setSelectionRange(i.value.length, i.value.length); } }); }, 350); }
});
document.addEventListener("submit", async e => {
  if (e.target.id === "filters") { e.preventDefault(); return; }
  if (e.target.id !== "review-form") return;
  e.preventDefault();
  const form = new FormData(e.target);
  if (!form.get("verdict")) { toast("Choose Correct or Wrong first."); return; }
  try {
    await apiPost(`/api/decisions/${e.target.dataset.id}/reviews`, { verdict: form.get("verdict"), expected_action: form.get("expected_action") || null, comment: form.get("comment") || "" });
    toast("Review saved"); render();
  } catch (err) { toast(err.message); }
});
window.addEventListener("hashchange", () => { window.scrollTo(0, 0); render(); });
document.addEventListener("click", async e => {
  const a = e.target.closest && e.target.closest("#desks a[data-desk]");
  if (!a || e.ctrlKey || e.metaKey || e.shiftKey || e.button !== 0) return;
  e.preventDefault();
  const key = a.dataset.desk; if (key === DESK) return;
  try { history.replaceState(null, "", deskHref(key)); } catch (_) { /* file:// previews */ }
  setDesk(key); S.filters.q = ""; S.offset = 0; S.id = null; S.live = null;
  $("#view").innerHTML = `<p class="loading">Loading…</p>`;
  try { await loadSession(); await loadCounts(); } catch (err) { $("#view").innerHTML = errorBox(err); return; }
  render();
}, true);
let resizeTimer, lastW = window.innerWidth;
window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (S.route === "overview" && Math.abs(window.innerWidth - lastW) > 40) { lastW = window.innerWidth; render(); } }, 250); });

async function loadCounts() {
  for (const id of ["#nav-review", "#nav-queue", "#nav-emails"]) $(id).textContent = "";
  try { const q = await apiGet("/api/quality?days=30"); $("#nav-review").textContent = q.needs_review.length || ""; const qq = await apiGet("/api/queue"); $("#nav-queue").textContent = qq.items.length || ""; const nn = await apiGet("/api/notifications?days=30"); $("#nav-emails").textContent = (nn.counts || {}).failed || ""; } catch (_) { /* counts are optional */ }
}
(async function start() {
  if (DEMO) $("#demo").innerHTML = `<div class="demo-banner"><b>Demo data.</b> This is a preview of the console with invented tickets for each desk. On the agent server it shows the real decision log, and changes you make here are not saved anywhere.</div>`;
  try { await loadSession(); } catch (err) { $("#view").innerHTML = errorBox(err); return; }
  await loadCounts();
  render();
  pollLive(); setInterval(pollLive, 5000);
})();
</script>
